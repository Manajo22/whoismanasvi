<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Diary of Things Unsaid</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: none; /* Hide cursor for immersion */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        #instruction {
            text-align: center;
            max-width: 400px;
            font-size: 1.1rem;
            letter-spacing: 0.1rem;
            line-height: 1.6;
        }

        .trigger {
            margin-top: 40px;
            text-decoration: underline;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0.5;
            transition: opacity 0.5s;
        }

        .trigger:hover { opacity: 1; }

        #reflection-output {
            display: none;
            position: absolute;
            width: 60%;
            text-align: left;
            font-style: italic;
            color: #888;
        }

        canvas { display: block; }

        #webcam-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0.1; /* Barely visible debug view */
            transform: scaleX(-1);
            width: 120px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="instruction">
            <div id="text-content">These are things I wrote down. They don’t make sense unless you try them.</div>
            <div id="action-btn" class="trigger" onclick="nextScene()">Begin</div>
        </div>
        <div id="reflection-output"></div>
    </div>

    <video id="webcam" autoplay playsinline style="display:none"></video>

    <script>
        // --- CONFIG & STATE ---
        let currentState = 0; // 0: Intro, 1: Control, 2: Perspective, 3: Lightness, 4: Avoidance, 5: Ending
        const scenes = [
            { txt: "These are things I wrote down. They don’t make sense unless you try them.", btn: "Begin" },
            { txt: "The more tightly you try to hold on, the more things go haywire.", btn: "I understand" },
            { txt: "When things don’t make sense, shift perspective.", btn: "Look closer" },
            { txt: "Take things lightly.", btn: "Release" },
            { txt: "Stop avoiding the inevitable.", btn: "Face it" },
            { txt: "Processing the residue...", btn: "" }
        ];

        let userStats = { clenchCount: 0, shifts: 0, smileTime: 0, hits: 0 };
        let particles = [];
        let handLandmarker, faceLandmarker;
        let video;
        let lastVideoTime = -1;

        // --- MEDIAPIPE SETUP ---
        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task` },
                runningMode: "VIDEO", numHands: 1
            });

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", outputFaceBlendshapes: true
            });
        }

        // --- P5.JS LOGIC ---
        function setup() {
            createCanvas(windowWidth, windowHeight);
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide();
            initAI();
            
            for(let i=0; i<100; i++) particles.push(new Particle());
        }

        function draw() {
            background(5, 5, 5, 20); // Ghostly trails
            
            if (!handLandmarker || !faceLandmarker) return;

            let startTimeMs = performance.now();
            if (lastVideoTime !== video.elt.currentTime) {
                lastVideoTime = video.elt.currentTime;
                
                const handResults = handLandmarker.detectForVideo(video.elt, startTimeMs);
                const faceResults = faceLandmarker.detectForVideo(video.elt, startTimeMs);

                handleInteractions(handResults, faceResults);
            }

            renderVisuals();
        }

        function handleInteractions(hands, faces) {
            if (currentState === 1 && hands.landmarks.length > 0) {
                // Scene 1: Control (Clench)
                let finger = hands.landmarks[0][8]; // Index tip
                let thumb = hands.landmarks[0][4]; // Thumb tip
                let d = dist(finger.x, finger.y, thumb.x, thumb.y);
                if (d < 0.05) {
                    userStats.clenchCount++;
                    noiseIntensity = 50; 
                } else {
                    noiseIntensity = 2;
                }
            }

            if (currentState === 2 && faces.faceLandmarks.length > 0) {
                // Scene 2: Perspective (Head movement)
                let nose = faces.faceLandmarks[0][1];
                userStats.shifts += abs(nose.x - 0.5);
            }

            if (currentState === 3 && faces.faceBlendshapes.length > 0) {
                // Scene 3: Lightness (Smile Detection)
                let shapes = faces.faceBlendshapes[0].categories;
                let smile = shapes.find(s => s.categoryName === "jawOpen").score; // Using jaw as proxy for "lightness"
                if (smile > 0.2) userStats.smileTime++;
            }
        }

        let noiseIntensity = 2;

        function renderVisuals() {
            translate(width/2, height/2);
            stroke(255, 30);
            noFill();

            if (currentState === 1) {
                // Aggressive noise based on clench
                for (let i = 0; i < 5; i++) {
                    beginShape();
                    for (let x = -200; x < 200; x += 10) {
                        let y = noise(x * 0.01, frameCount * 0.05) * noiseIntensity * 10;
                        vertex(x, y);
                    }
                    endShape();
                }
            } else {
                // Default drifting particles
                particles.forEach(p => {
                    p.update();
                    p.show();
                });
            }
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(-width, width), random(-height, height));
                this.vel = createVector(random(-1, 1), random(-1, 1));
            }
            update() {
                this.pos.add(this.vel);
                if(this.pos.x > width/2) this.pos.x = -width/2;
            }
            show() {
                point(this.pos.x, this.pos.y);
            }
        }

        // --- STATE MANAGEMENT ---
        function nextScene() {
            currentState++;
            if (currentState >= scenes.length - 1) {
                generateAIFinal();
            }
            
            const content = scenes[currentState];
            document.getElementById('text-content').innerText = content.txt;
            document.getElementById('action-btn').innerText = content.btn;
            
            if (content.btn === "") document.getElementById('action-btn').style.display = "none";
        }

        // --- GEMINI API ---
        async function generateAIFinal() {
            const API_KEY = "YOUR_GOOGLE_AI_STUDIO_KEY"; // REPLACE THIS
            const prompt = `Act as a cryptic, slightly unsettling observer. Based on these user stats: 
            Clenching/Control: ${userStats.clenchCount}, Perspective shifting: ${userStats.shifts.toFixed(2)}, 
            Lightness/Smiling: ${userStats.smileTime}. 
            Write a 3-sentence poetic reflection about their soul. Be cold and surreal.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const reflection = data.candidates[0].content.parts[0].text;
                
                document.getElementById('text-content').style.display = "none";
                const output = document.getElementById('reflection-output');
                output.style.display = "block";
                output.innerText = reflection;
            } catch (e) {
                document.getElementById('reflection-output').innerText = "You moved, but remained unseen.";
                document.getElementById('reflection-output').style.display = "block";
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
